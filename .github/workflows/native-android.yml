name: Android native build

# Build and upload a NATIVE Android build to Google Play. Manual, for the same
# reason as iOS: a store build is a decision, not a consequence of a push.
#
#   track = internal    -> Play internal testing  (carries the development channel)
#   track = production  -> Play production        (carries the production channel)
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          upload key alias
#   ANDROID_KEY_PASSWORD       key password
#   GOOGLE_PLAY_JSON_KEY       the Play service-account JSON, whole file
#
# The build number is generated at build time (unix epoch minutes) and never
# committed — the same clock as iOS, so the two never disagree about which
# build is newer.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [internal, production]
        default: internal
      bump:
        description: "App version bump"
        type: choice
        options: [none, patch, minor, major]
        default: none

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.bn.outputs.build }}
      channel: ${{ steps.bn.outputs.channel }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      # A Play production build carries the production channel and reaches a
      # real shop, so it is cut from main and nowhere else.
      - name: Guard — Play production builds only from main
        if: ${{ inputs.track == 'production' && github.ref_name != 'main' }}
        run: |
          echo "::error::Play production builds must run from 'main', not '${{ github.ref_name }}'. Promote to main first."
          exit 1

      - uses: actions/checkout@v4

      # A run carries the commit it was QUEUED at, not the branch tip it ends
      # up running against. These builds serialise behind one another, so a
      # second dispatch can sit in the queue while the first one finishes and
      # commits its version bump — and then build the tree from before that
      # bump. That is exactly what happened on 18 Sep: two dispatches 49
      # seconds apart produced build 29828651 carrying version 1.0.0 *after*
      # build 29828633 carrying 1.0.1, and the later one overwrote the version
      # gate with a higher build number and an older name.
      #
      # Re-dispatching is one click. A binary in TestFlight that claims to be
      # older than the one before it is days of confusion.
      - name: Guard — the branch has not moved since this run was queued
        run: |
          git fetch --quiet origin "${{ github.ref_name }}"
          TIP="$(git rev-parse "origin/${{ github.ref_name }}")"
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "::error::This run was queued at ${{ github.sha }}, but ${{ github.ref_name }} is now at $TIP — probably a build that finished while this one waited. Re-dispatch so the build is cut from the current tree."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute build number and channel
        id: bn
        run: |
          echo "build=$(node apps/mobile/scripts/next-build-number.js)" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.track }}" = "production" ]; then
            echo "channel=production" >> "$GITHUB_OUTPUT"
          else
            echo "channel=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve app version
        id: bump
        run: echo "version=$(node apps/mobile/scripts/version.js '${{ inputs.bump }}')" >> "$GITHUB_OUTPUT"

      - name: Point the binary at its server
        run: node apps/mobile/scripts/configure-ota-target.js "${{ steps.bn.outputs.channel }}"

      - name: Set up Ruby for fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile

      - name: Install mobile JS deps
        working-directory: apps/mobile
        run: npm ci

      - name: Write the upload keystore and the Play key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/upload-keystore.jks
          echo "$GOOGLE_PLAY_JSON_KEY" > "$RUNNER_TEMP/play-key.json"

      - name: Build and upload
        working-directory: apps/mobile
        env:
          LANE: ${{ inputs.track == 'production' && 'release' || 'beta' }}
          BUILD_NUMBER: ${{ steps.bn.outputs.build }}
          MARKETING_VERSION: ${{ steps.bump.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-key.json
        run: bundle exec fastlane android "$LANE"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f apps/mobile/android/app/upload-keystore.jks "$RUNNER_TEMP/play-key.json"

  post_release:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/post-native-release.yml
    with:
      platform: android
      channel: ${{ needs.build.outputs.channel }}
      build: ${{ needs.build.outputs.build }}
      versionName: ${{ needs.build.outputs.version }}
      storeUrl: "https://play.google.com/store/apps/details?id=com.firstleap.factoryautomation"
    secrets: inherit
