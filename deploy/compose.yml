# The API on one box, behind TLS.
#
#   cd /srv/fas && docker compose -f deploy/compose.yml up -d --build
#
# One process, not two. `ROLE` is deliberately unset, so this container both
# serves requests and runs the scheduled work — see apps/api/src/common/jobs/
# role.ts. Splitting them is right the moment there is a second box to put the
# worker on; on a 1 GB instance a second Node process with its own Prisma
# client costs more memory than the separation is worth, and a worker that gets
# OOM-killed every night is worse than no separation at all.
#
# Everything secret comes from deploy/env/<environment>.env, which is never
# committed. See apps/api/.env.example for what belongs in it. The two
# variables compose itself needs — FAS_ENV, to pick that file, and API_DOMAIN,
# for the certificate — go in deploy/.env, because env_file is handed to the
# container and is not read for interpolation here.

name: fas

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: env/${FAS_ENV:?set FAS_ENV}.env
    environment:
      # Caddy is the only thing that talks to it, over the compose network.
      PORT: 3001
    restart: unless-stopped
    # Docker's own check, so a container that has stopped answering is
    # restarted rather than left to keep failing quietly.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    # A runaway request must not take the box down with it. The instance has
    # 1 GB; Caddy and the OS need the rest.
    mem_limit: 700m

  # Migrations, run before the new code serves and never on its own schedule.
  #
  # It builds the *build* stage rather than the runtime one: migrate-tenants.ts
  # needs ts-node and the Prisma CLI, both of which are dev dependencies the
  # runtime image deliberately does not carry.
  #
  # `prisma migrate deploy` would migrate one database. This migrates the
  # platform's and every dedicated tenant's, and exits non-zero if any could
  # not be reached — see CLAUDE.md, "A schema change reaches every tenant, or
  # none".
  #
  #   docker compose -f deploy/compose.yml --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: build
    env_file: env/${FAS_ENV:?set FAS_ENV}.env
    command: ["npm", "run", "db:migrate:tenants"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The name the certificate is issued for. Set in deploy/.env.
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  # The issued certificates. Losing this volume means asking Let's Encrypt for
  # new ones, which is rate-limited — five per domain per week.
  caddy_data:
  caddy_config:
