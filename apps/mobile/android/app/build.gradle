apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /*
     * The bundle is built by Expo's CLI now.
     *
     * `expo export:embed` is what resolves the app entry through Expo's own
     * metro config, which is where the modules — expo-updates among them — are
     * registered. @expo/cli is resolved through the installed `expo` package
     * rather than from here: npm does not hoist it, so a bare
     * require.resolve('@expo/cli') from android/ finds nothing and the failed
     * command silently yields a directory instead of a file.
     */
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.firstleap.factoryautomation"
    defaultConfig {
        applicationId "com.firstleap.factoryautomation"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * Given by whoever is building, not written down here.
         *
         * Fastlane passes them, from the same clock the iOS archive uses, so
         * the two platforms never disagree about which build is newer. They
         * were hardcoded to 1 and "1.0", and Gradle ignores a `-PversionCode`
         * that nothing reads — so every Android build would have shipped as
         * versionCode 1, and Play refuses a second upload at a code it has
         * already seen. The first build would have worked and the second
         * would have failed, which is the worst order to find this out in.
         */
        // Read into locals first. `versionCode (expr).toString()` parses as the
        // call `versionCode(expr)` — which returns nothing — and then chains on
        // that nothing, so the build fails with "Value is null" and a line
        // number that looks like it is about the property rather than the
        // parentheses.
        def buildNumber = (project.findProperty("versionCode") ?: "1").toString().toInteger()
        def marketing = (project.findProperty("versionName") ?: "1.0").toString()
        versionCode buildNumber
        versionName marketing
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        /**
         * The upload key, which is what Play recognises this app by.
         *
         * Supplied by the environment rather than committed: the keystore is
         * the shop's app identity on Play, and a copy of it in the repository
         * is a copy anybody with the repository has.
         *
         * Configured only when the file is actually there, so an ordinary
         * `assembleDebug` on somebody's laptop does not have to have it. A
         * release build without it fails loudly — see the check at the foot of
         * this file.
         */
        release {
            def keystore = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "upload-keystore.jks")
            if (keystore.exists()) {
                storeFile keystore
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

/*
 * A release must never be signed with the debug key.
 *
 * The React Native template ships `release` pointing at `signingConfigs.debug`
 * with a comment telling you to change it, and that is exactly the kind of
 * instruction a project carries for a year. A debug-signed bundle is not a
 * build that fails — it is a build that succeeds, uploads, and is refused by
 * Play with a message about the certificate, days later and far from the
 * cause. Worse, if one were ever accepted, the debug key becomes the app's
 * identity and cannot be changed afterwards.
 *
 * So the absence of the upload keystore stops a release build here, where the
 * reason is in front of whoever started it.
 */
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { task ->
        task.project == project &&
            (task.name.startsWith("bundle") || task.name.startsWith("assemble")) &&
            task.name.toLowerCase().contains("release")
    }
    if (releasing && android.signingConfigs.release.storeFile == null) {
        throw new GradleException(
            "No upload keystore, so this release would be signed with the debug key and " +
            "refused by Play. Point ANDROID_KEYSTORE_PATH at the .jks, or put it at " +
            "android/app/upload-keystore.jks, and set ANDROID_KEYSTORE_PASSWORD, " +
            "ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
